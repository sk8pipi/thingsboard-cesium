services:
  polaris-nginx:
    build:
      context: ../source/wvp-GB28181-pro
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      polaris-wvp:
        condition: service_started
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    expose:
      - "18978"
    volumes:
      - ../source/wvp-GB28181-pro/docker/nginx/templates/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ../config/nginx/zlm-hook-fanout.conf.template:/etc/nginx/templates/zlm-hook-fanout.conf.template:ro
      - ../logs/nginx:/var/log/nginx
    environment:
      Stream_IP: "${WVP_PUBLIC_IP:-10.242.216.241}"
      NGINX_ENVSUBST_FILTER: "^(Stream_IP|VIDEO_HOOK_THINGSBOARD_URL|VIDEO_ZLM_HOOK_TOKEN)$"
      VIDEO_HOOK_THINGSBOARD_URL: "${VIDEO_HOOK_THINGSBOARD_URL:-http://host.docker.internal:8080}"
      VIDEO_ZLM_HOOK_TOKEN: "${VIDEO_ZLM_HOOK_TOKEN:-}"
    extra_hosts:
      - host.docker.internal:host-gateway
